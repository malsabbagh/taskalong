name: Distribution qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  distribution:
    name: distribution / ${{ matrix.os }} / Python 3.14 / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        run: git -c core.autocrlf=false checkout-index -f -a
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: python -m pip install --isolated --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - run: python -m build --no-isolation --wheel --sdist
      - run: python tools/normalize_sdist.py dist/*.tar.gz
      - run: python tools/check_dist.py --dist-dir dist
      - run: python -m unittest discover -s tools/tests -v
      - run: node --test packages/npm/cli/test/launcher.test.js
      - run: python tools/release_version.py --root . --tag v0.1.0a1
      - run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", str(wheels[0])], check=True)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
            f.write(f"TASKALONG_TEST_PYTHON={sys.executable}\n")
          PY
      - env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          mkdir -p "$NPM_CONFIG_CACHE" npm-dist receipts
          npm pack ./packages/npm/cli --offline --ignore-scripts --pack-destination npm-dist
      - run: python tools/release_bundle.py audit-npm --root . --archive npm-dist/taskalong-cli-0.1.0-alpha.1.tgz > receipts/audit.json
      - run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          with Path("receipts/consumer.json").open("w", encoding="utf-8") as out:
            subprocess.run([sys.executable, "tools/release_bundle.py", "npm-consumer", "--root", ".", "--archive", "npm-dist/taskalong-cli-0.1.0-alpha.1.tgz", "--python", sys.executable], check=True, stdout=out)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/*.json
          if-no-files-found: warn
