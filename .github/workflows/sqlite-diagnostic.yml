name: SQLite native wait diagnostic (not qualification)
on:
  push:
    branches: [diagnostic/sqlite-exclusion-91042f1]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: 91042f14a5b47a1f739fe39ed7f20cd26f7918da
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
      - name: Prepare exact source wheel and isolated diagnostic environment
        run: |
          python -m pip --isolated install --require-hashes -r candidate/requirements-dev.lock
          (cd candidate && python -m build --no-isolation --wheel)
          python - <<'PY'
          import os,sys,venv
          from pathlib import Path
          source=Path('candidate').resolve()
          work=Path(os.environ['RUNNER_TEMP'])/'sqlite-diagnostic-work'
          work.mkdir()
          sys.path.insert(0,str(source/'tools'))
          from qualify_installed import snapshot_harness
          print('snapshot_harness_sha256='+snapshot_harness(source,work))
          venv.EnvBuilder(with_pip=True).create(Path(os.environ['RUNNER_TEMP'])/'sqlite-diagnostic-venv')
          PY
          "$RUNNER_TEMP/sqlite-diagnostic-venv/bin/python" -m pip --isolated install --require-hashes -r candidate/requirements-dev.lock
          "$RUNNER_TEMP/sqlite-diagnostic-venv/bin/python" -m pip --isolated install --no-deps candidate/dist/*.whl
      - name: Run control and one sampled complete probe
        run: |
          "$RUNNER_TEMP/sqlite-diagnostic-venv/bin/python" diagnostic/.github/diagnostics/sqlite_exclusion.py --source candidate --work "$RUNNER_TEMP/sqlite-diagnostic-work" --wheel candidate/dist/taskalong-0.1.0a1-py3-none-any.whl
