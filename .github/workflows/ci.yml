name: Core qualification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producer:
    name: producer / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked build and test dependencies
        run: python -m pip --isolated install --require-hashes -r requirements-dev.lock
      - name: Build candidate artifacts
        run: |
          python -m build --no-isolation --sdist --wheel
          python tools/normalize_sdist.py dist/*.tar.gz
      - name: Audit exact distribution contents
        id: audit
        run: python tools/check_dist.py --dist-dir dist > distribution-audit.json
      - name: Install ordinary wheel for public boundary tests
        run: python -m pip --isolated install --no-deps dist/*.whl
      - name: Install checksum-pinned released reviewer for fixture tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from qualify_installed import acquire_review
          acquire_review(None, Path(os.environ['RUNNER_TEMP']) / 'review_sensei-0.8.8-py3-none-any.whl')
          PY
          python -m pip --isolated install --no-deps "$RUNNER_TEMP/review_sensei-0.8.8-py3-none-any.whl"
      - name: Run behavior, process, store, and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Check documentation and whitespace
        run: |
          python scripts/check_docs.py
          git diff --check
      - name: Bind qualified producer artifacts to this run and checkout
        run: |
          python tools/qualification_bundle.py write --os-profile '${{ matrix.os }}' --python-profile '${{ matrix.python }}'
          python tools/qualification_shards.py inventory --directory . --os-profile '${{ matrix.os }}' --python-profile '${{ matrix.python }}' > installed-inventory.json
      - name: Retain exact producer artifacts and identity
        id: upload_producer
        if: ${{ always() && steps.audit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: producer-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            distribution-audit.json
            producer-identity.json
            installed-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Retry retaining exact producer artifacts on transient upload failure
        if: ${{ always() && steps.audit.outcome == 'success' && steps.upload_producer.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: producer-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            distribution-audit.json
            producer-identity.json
            installed-inventory.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  installed-shards:
    name: installed shard / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.lane }}
    needs: producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
        lane: [wheel-core, sdist]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked qualification dependencies
        run: python -m pip --isolated install --require-hashes -r requirements-dev.lock
      - name: Download the immutable matching producer bundle from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: producer-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Verify exact producer identity and distribution bytes
        id: audit
        run: |
          python tools/qualification_bundle.py verify --os-profile '${{ matrix.os }}' --python-profile '${{ matrix.python }}'
          python tools/check_dist.py --dist-dir dist > installed-distribution-audit.json
      - name: Acquire checksum-pinned released reviewer for fixture tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from qualify_installed import acquire_review
          acquire_review(None, Path(os.environ['RUNNER_TEMP']) / 'review_sensei-0.8.8-py3-none-any.whl')
          PY
      - name: Qualify ordinary wheel and core-only sample
        if: matrix.lane == 'wheel-core'
        run: |
          python tools/qualify_installed.py --format-version 3 --dist-dir dist --artifact wheel --mode fixture --review-wheel "$RUNNER_TEMP/review_sensei-0.8.8-py3-none-any.whl" --evidence-dir qualification-progress/wheel > installed-wheel.json
          python tools/qualify_installed.py --format-version 3 --dist-dir dist --artifact wheel --mode fixture --core-only --evidence-dir qualification-progress/core-only > installed-core-only.json
      - name: Qualify rebuilt sdist
        if: matrix.lane == 'sdist'
        run: python tools/qualify_installed.py --format-version 3 --dist-dir dist --artifact sdist --mode fixture --review-wheel "$RUNNER_TEMP/review_sensei-0.8.8-py3-none-any.whl" --evidence-dir qualification-progress/sdist > installed-sdist.json
      - name: Seal complete lane receipts against this producer and attempt
        run: |
          mkdir shard-result
          cp producer-identity.json installed-inventory.json shard-result/
          if [ '${{ matrix.lane }}' = wheel-core ]; then
            cp installed-wheel.json installed-core-only.json shard-result/
          else
            cp installed-sdist.json shard-result/
          fi
          python tools/qualification_shards.py seal --format-version 3 --directory shard-result --os-profile '${{ matrix.os }}' --python-profile '${{ matrix.python }}' --lane '${{ matrix.lane }}'
      - name: Retain complete sealed shard result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: shard-result/
          if-no-files-found: error
          retention-days: 14
        id: upload_shard
        continue-on-error: true
      - name: Retry retaining complete sealed shard result on transient upload failure
        if: steps.upload_shard.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: shard-result/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retain artifact and qualification diagnostics
        id: upload_diagnostics
        if: ${{ always() && steps.audit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            producer-identity.json
            installed-distribution-audit.json
            installed-wheel.json
            installed-sdist.json
            installed-core-only.json
            qualification-progress/
          if-no-files-found: error
          retention-days: 14
      - name: Retry retaining artifact and qualification diagnostics on transient upload failure
        if: ${{ always() && steps.audit.outcome == 'success' && steps.upload_diagnostics.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            producer-identity.json
            installed-distribution-audit.json
            installed-wheel.json
            installed-sdist.json
            installed-core-only.json
            qualification-progress/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Keep the original installed check names: each now requires both artifact lanes.
  installed-core:
    name: installed / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: always()
    needs: [producer, installed-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Require every producer and installed shard to succeed
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          SHARD_RESULT: ${{ needs.installed-shards.result }}
        run: test "$PRODUCER_RESULT" = success && test "$SHARD_RESULT" = success
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Download both lanes from this exact attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualification-${{ matrix.os }}-py${{ matrix.python }}-*-${{ github.sha }}-${{ github.run_attempt }}
          path: shard-results/
      - name: Require exact coverage and matching producer identities
        run: python tools/qualification_shards.py aggregate --format-version 3 --directory shard-results --os-profile '${{ matrix.os }}' --python-profile '${{ matrix.python }}' > installed-aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: installed-aggregate.json
          if-no-files-found: error
          retention-days: 14
        id: upload_installed
        continue-on-error: true
      - name: Retry retaining installed aggregate on transient upload failure
        if: steps.upload_installed.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: installed-aggregate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  qualification-complete:
    name: Complete qualification
    if: always()
    needs: [producer, installed-shards, installed-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require all existing and sharded checks
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          SHARD_RESULT: ${{ needs.installed-shards.result }}
          INSTALLED_RESULT: ${{ needs.installed-core.result }}
        run: test "$PRODUCER_RESULT" = success && test "$SHARD_RESULT" = success && test "$INSTALLED_RESULT" = success
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Download all sixteen results from this exact attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualification-*-${{ github.sha }}-${{ github.run_attempt }}
          path: shard-results/
      - name: Validate the entire required platform and artifact matrix
        run: python tools/qualification_shards.py aggregate --format-version 3 --directory shard-results > qualification-aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-aggregate-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification-aggregate.json
          if-no-files-found: error
          retention-days: 14
        id: upload_complete
        continue-on-error: true
      - name: Retry retaining qualification aggregate on transient upload failure
        if: steps.upload_complete.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-aggregate-${{ github.sha }}-${{ github.run_attempt }}
          path: qualification-aggregate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
